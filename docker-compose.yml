# Quaykeeper - container deployment.
#
# Configure via environment variables (QK_*) - no config.yaml needed:
#   QK_PORTAINER_URL      e.g. http://portainer:9000 (or https://:9443)
#   QK_PORTAINER_API_KEY  your Portainer API key
# Or leave both empty and finish setup in the web UI (Settings tab).
# Variables with the old PUS_ prefix are still understood.
#
# Auth: reachable beyond localhost means a token is required. Without
# QK_AUTH_TOKEN, Quaykeeper generates one on first start and prints it in
# the container log (docker logs quaykeeper).
#
# The docker socket is NOT mounted by default: only the optional "update
# Portainer itself" feature needs it. Checks, backups, pruning and stack
# redeploys all go through the Portainer API.

services:
  quaykeeper:
    build: .
    container_name: quaykeeper
    restart: unless-stopped
    ports:
      - "8090:8090"        # inside the container the app binds 0.0.0.0
    environment:
      QK_LISTEN_HOST: "0.0.0.0"                       # REQUIRED in a container
      QK_LISTEN_PORT: "8090"
      # Credentials: either set them here, or leave them out and finish
      # setup in the web UI (Settings tab) - env vars win over the UI.
      # QK_PORTAINER_URL: "http://portainer:9000"
      # QK_PORTAINER_API_KEY: "ptr_xxxxxxxxxxxxxxxxxxxx"
      QK_UPDATE_INTERVAL_HOURS: "168"                 # weekly (interval mode)
      # QK_AUTH_TOKEN: "choose-a-long-random-string" # else one is generated
      # QK_NOTIFY_WEBHOOK: "https://ntfy.sh/your-topic"
      TZ: "Europe/Berlin"
    volumes:
      # volume names kept from the 'update-service' days on purpose:
      # renaming them would start existing installs with empty history,
      # backups and settings
      - update-service-data:/app/data                  # status/history/logs/backups
      - update-service-config:/app/config              # settings (survive redeploys)
      # only for 'update Portainer itself' (Settings), together with
      # Portainer's compose dir mounted read-only (see docs/configuration.md):
      # - /var/run/docker.sock:/var/run/docker.sock
      # - /path/to/portainer:/host-portainer:ro
    # Quaykeeper detects the stack that runs it and never redeploys itself
    # during an update run - use 'Update Quaykeeper' in Settings for that.

volumes:
  update-service-data:
  update-service-config:
